<!doctype html>
<html lang="en">
<head>

  <title>Cortex Mental Control · MasterHub</title>
  <link rel="stylesheet" href="/static/masterhub.css">
</head>
<body>
  <main class="cortex-console">
    <header class="cortex-console-header"><a href="/dashboard">← MasterHub manual controls</a><span>Cortex Classic · One headset · Four domains</span></header>

      <span id="online">Offline</span>
      <button id="connect">Connect</button>
      <button id="disconnect">Disconnect</button>

        <input id="cortexClientId" />
        <input id="cortexClientSecret" />
        <select id="cortexProfileSelect"></select>
        <button id="saveCredsBtn">Save</button>
        <button id="queryProfilesBtn">Query</button>
      </div>
      <div id="consoleBody"></div>
      <button>Save JSON</button>
      <button>Save CSV</button>
      <button>Clear</button>
    </div>

  <script src="/static/bci-panel.js"></script>

</html>
