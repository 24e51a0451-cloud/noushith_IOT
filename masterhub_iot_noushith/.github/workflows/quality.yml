name: Test and package MasterHub
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: masterhub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d masterhub_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/masterhub_test
      MQTT_HOST: 127.0.0.1
      BCI_MOBILE_MQTT_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: python -m pip install -r requirements-production.txt -r tests/requirements.txt
      - run: python -m pip check
      - run: python -m coverage run -m pytest tests -q
      - run: python -m coverage xml
      - run: node --test tests/test_dashboard_security.cjs tests/test_dashboard_temporal.cjs
      - run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: masterhub-verified-source
          path: dist/masterhub.zip
